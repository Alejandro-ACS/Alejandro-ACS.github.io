  <meta charset="UTF-8">
  <title>Reproductor M3U8 Mejorado</title>
  <style>
    body {
      background: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 2rem;
    }
    #videoContainer {
      position: relative;
      width: 80%;
      max-width: 800px;
      background: black;
      border-radius: 8px;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 8px;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 1rem;
      box-sizing: border-box;
    }
    #nextButton {
      background: #1db954;
      color: white;
      border: none;
      padding: 0.75rem 1.2rem;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      display: none;
      opacity: 0.9;
      pointer-events: auto;
      transition: opacity 0.3s ease;
    }
    #nextButton:hover {
      opacity: 1;
    }
    .selectors {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
      width: 80%;
      max-width: 800px;
    }
    select {
      flex: 1;
      padding: 0.5rem;
      font-size: 1rem;
      border-radius: 5px;
      border: none;
    }

    /* Estilos para fullscreen */
    :fullscreen #videoContainer,
    :-webkit-full-screen #videoContainer {
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      border-radius: 0;
    }

    :fullscreen #overlay,
    :-webkit-full-screen #overlay {
      width: 100vw;
      height: 100vh;
    }

  </style>
</head>

        "Episodio 9": "https://cloud3-atres-st-ams.atresmedia.com/nogeo/assets14/2016/10/15/7117DB1D-3C62-4521-B01E-30BEA000DDBB/packaged/hls/playlist.m3u8",
        "Episodio 10": "https://cloud3-atres-st-ams.atresmedia.com/nogeo/assets14/2016/10/15/4FFEE020-608E-4699-B4C1-004950EB3A13/packaged/hls/playlist.m3u8",
        "Episodio 11": "https://cloud3-atres-st-ams.atresmedia.com/nogeo/assets13/2016/10/15/3C482D05-10B8-45A8-AE16-2BACD6EFA5D2/packaged/hls/playlist.m3u8",
        "Episodio 13": "https://cloud3-atres-st-ams.atresmedia.com/nogeo/assets14/2016/10/15/B0904468-94E2-44E8-A9F1-DA5D28701E18/packaged/hls/playlist.m3u8"
      }
    };

    let hls;
    let checkTimeInterval;

    function cargarTemporadas() {
      for (const temporada in episodios) {
        const option = document.createElement('option');
        option.value = temporada;
        option.textContent = temporada;
        temporadaSelect.appendChild(option);
      }
    }

    function cargarEpisodios(temporada) {
      episodioSelect.innerHTML = '<option value="">Selecciona un episodio</option>';
      if (temporada) {
        const episodiosTemporada = episodios[temporada];
        for (const episodio in episodiosTemporada) {
          const option = document.createElement('option');
          option.value = episodio;
          option.textContent = episodio;
          episodioSelect.appendChild(option);
        }
        episodioSelect.disabled = false;
      } else {
        episodioSelect.disabled = true;
      }
    }

    function cargarVideo(url) {
      if (hls) {
        hls.destroy();
      }
      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', function() {
          video.play();
        });
      } else {
        alert('Tu navegador no soporta HLS');
      }
    }

    function getNextEpisode(currentSeason, currentEpisode) {
      const temporadas = Object.keys(episodios);
      const episodiosTemporada = Object.keys(episodios[currentSeason]);
      const episodioIndex = episodiosTemporada.indexOf(currentEpisode);

      if (episodioIndex < episodiosTemporada.length - 1) {
        return {
          temporada: currentSeason,
          episodio: episodiosTemporada[episodioIndex + 1]
        };
      } else {
        const temporadaIndex = temporadas.indexOf(currentSeason);
        if (temporadaIndex < temporadas.length - 1) {
          const siguienteTemporada = temporadas[temporadaIndex + 1];
          const primerEpisodio = Object.keys(episodios[siguienteTemporada])[0];
          return {
            temporada: siguienteTemporada,
            episodio: primerEpisodio
          };
        }
      }
      return null;
    }

    function controlarProgreso() {
      clearInterval(checkTimeInterval);

      checkTimeInterval = setInterval(() => {
        if (video.duration > 0 && video.currentTime > video.duration * 0.9) {
          const next = getNextEpisode(temporadaSelect.value, episodioSelect.value);
          if (next) {
            nextButton.style.display = 'block';
          } else {
            nextButton.style.display = 'none';
          }
        } else {
          nextButton.style.display = 'none';
        }
      }, 1000);
    }

    temporadaSelect.addEventListener('change', function() {
      cargarEpisodios(this.value);
      video.pause();
      nextButton.style.display = 'none';
      clearInterval(checkTimeInterval);
    });

    episodioSelect.addEventListener('change', function() {
      const temporada = temporadaSelect.value;
      const episodio = episodioSelect.value;

      if (temporada && episodio) {
        const url = episodios[temporada][episodio];
        cargarVideo(url);
        controlarProgreso();
      }
    });

    nextButton.addEventListener('click', function() {
      const next = getNextEpisode(temporadaSelect.value, episodioSelect.value);
      if (next) {
        temporadaSelect.value = next.temporada;
        cargarEpisodios(next.temporada);
        episodioSelect.value = next.episodio;
        const url = episodios[next.temporada][next.episodio];
        cargarVideo(url);
        controlarProgreso();
      }
      this.style.display = 'none';
    });

    // Doble clic para fullscreen
    video.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) {
        videoContainer.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    cargarTemporadas();

  </script>

</body>
</html>
